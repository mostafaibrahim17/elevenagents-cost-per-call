<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#15263b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c8aa5"/>
    </marker>
  </defs>

  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text x="80" y="120" fill="#8fa3bf" font-size="20" font-weight="600" letter-spacing="3">ELEVENAGENTS · COST PER CALL</text>
  <text x="80" y="188" fill="#ffffff" font-size="52" font-weight="800">The rate is $0.08 a minute.</text>
  <text x="80" y="248" fill="#ffffff" font-size="52" font-weight="800">The bill has <tspan fill="#fbbf24">three lines</tspan>.</text>
  <text x="80" y="308" fill="#c6d3e6" font-size="22" font-weight="500">Estimate it, read it back from the API, and roll up a week of real calls.</text>

  <!-- bill motif -->
  <g transform="translate(80,352)">
    <rect x="0" y="0" width="210" height="40" rx="8" fill="#132234" stroke="#2b3d55"/>
    <circle cx="22" cy="20" r="7" fill="#60a5fa"/><text x="40" y="26" fill="#dfe8f5" font-size="15">Platform  $0.123</text>
    <rect x="0" y="50" width="210" height="40" rx="8" fill="#132234" stroke="#2b3d55"/>
    <circle cx="22" cy="70" r="7" fill="#c4b5fd"/><text x="40" y="76" fill="#dfe8f5" font-size="15">Phone line  $0.017</text>

    <rect x="240" y="0" width="210" height="40" rx="8" fill="#2a2210" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="262" cy="20" r="7" fill="#fbbf24"/><text x="280" y="26" fill="#fde68a" font-size="15" font-weight="700">LLM  $0.0026</text>
    <text x="250" y="72" fill="#9fb6c9" font-size="13">the line you change most</text>

    <line x1="470" y1="45" x2="560" y2="45" stroke="#7c8aa5" stroke-width="2" marker-end="url(#ah)"/>

    <rect x="570" y="0" width="230" height="90" rx="12" fill="#0f2b33" stroke="#2dd4bf" stroke-width="2"/>
    <text x="685" y="42" fill="#ffffff" font-size="30" font-weight="800" text-anchor="middle">$0.143</text>
    <text x="685" y="68" fill="#9fb6c9" font-size="13" text-anchor="middle">one real 92-second call, all in</text>

    <text x="830" y="30" fill="#8fa3bf" font-size="14">npm run estimate</text>
    <text x="830" y="54" fill="#8fa3bf" font-size="14">npm run call-cost</text>
    <text x="830" y="78" fill="#8fa3bf" font-size="14">npm run report</text>
  </g>
</svg>
